services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-syncapi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-syncapi}
      POSTGRES_DB: ${POSTGRES_DB:-store_pos_sync}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-syncapi} -d ${POSTGRES_DB:-store_pos_sync}']
      interval: 5s
      timeout: 5s
      retries: 10

  sync-api:
    build: ./cloud-sync-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8787
      DATABASE_URL: postgres://${POSTGRES_USER:-syncapi}:${POSTGRES_PASSWORD:-syncapi}@postgres:5432/${POSTGRES_DB:-store_pos_sync}
    ports:
      - '${SYNC_API_PORT:-8787}:8787'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8787/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
